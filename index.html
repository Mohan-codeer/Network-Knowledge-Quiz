<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NW Route — Networking Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --card: #1a2236;
    --border: #2a3a5c;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --danger: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --correct: #10b981;
    --wrong: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.8);
    backdrop-filter: blur(12px);
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--accent); }

  .score-badge {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    color: var(--accent);
    padding: 6px 16px;
    border-radius: 20px;
    display: flex;
    gap: 12px;
  }

  /* Progress bar */
  .progress-wrap {
    height: 3px;
    background: var(--border);
    position: relative;
    z-index: 10;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  /* Main layout */
  main {
    position: relative;
    z-index: 10;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  /* Screen: Home */
  #home-screen {
    text-align: center;
    padding-top: 40px;
  }

  .tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.2);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -2px;
    margin-bottom: 16px;
  }

  h1 em { color: var(--accent); font-style: normal; }

  .subtitle {
    color: var(--muted);
    font-size: 18px;
    max-width: 500px;
    margin: 0 auto 48px;
    line-height: 1.6;
    font-weight: 400;
  }

  /* Topic grid */
  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 40px;
    text-align: left;
  }

  .topic-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .topic-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,212,255,0.05), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .topic-card:hover::before { opacity: 1; }
  .topic-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .topic-card.selected { border-color: var(--accent); background: rgba(0,212,255,0.08); }
  .topic-card.selected .topic-check { opacity: 1; }

  .topic-icon { font-size: 24px; margin-bottom: 8px; }
  .topic-name { font-weight: 700; font-size: 14px; }
  .topic-count { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: 'Space Mono', monospace; }

  .topic-check {
    position: absolute;
    top: 10px; right: 10px;
    width: 18px; height: 18px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover {
    background: #00b8d9;
    transform: translateY(-1px);
    box-shadow: 0 8px 30px rgba(0,212,255,0.3);
  }

  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Quiz screen */
  #quiz-screen { display: none; }

  .q-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .q-type-badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
  }

  .badge-mcq { background: rgba(124,58,237,0.15); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }
  .badge-fitb { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.3); }
  .badge-tf { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
  .badge-match { background: rgba(245,158,11,0.1); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
  .badge-order { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

  .q-counter {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .q-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .q-number {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 28px;
    color: #f1f5f9;
  }

  /* MCQ Options */
  .options-grid {
    display: grid;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    color: var(--text);
  }

  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(0,212,255,0.05);
  }

  .option.selected { border-color: var(--accent); background: rgba(0,212,255,0.1); }
  .option.correct { border-color: var(--correct) !important; background: rgba(16,185,129,0.1) !important; }
  .option.wrong { border-color: var(--wrong) !important; background: rgba(239,68,68,0.1) !important; }
  .option.disabled { cursor: default; }

  .opt-label {
    width: 30px; height: 30px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option.selected .opt-label { background: var(--accent); color: #000; }
  .option.correct .opt-label { background: var(--correct); color: #000; }
  .option.wrong .opt-label { background: var(--wrong); color: #fff; }

  /* True/False */
  .tf-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .tf-btn {
    padding: 28px 20px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    transition: all 0.2s;
    text-align: center;
  }

  .tf-btn:hover:not(.disabled) { border-color: var(--accent); }
  .tf-btn.selected { border-color: var(--accent); background: rgba(0,212,255,0.1); }
  .tf-btn.correct { border-color: var(--correct) !important; background: rgba(16,185,129,0.15) !important; color: var(--correct) !important; }
  .tf-btn.wrong { border-color: var(--wrong) !important; background: rgba(239,68,68,0.15) !important; color: var(--wrong) !important; }

  /* Fill in blank */
  .fitb-wrap { margin-top: 8px; }

  .fitb-input {
    width: 100%;
    padding: 16px 20px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  .fitb-input:focus { border-color: var(--accent); }
  .fitb-input.correct { border-color: var(--correct); }
  .fitb-input.wrong { border-color: var(--wrong); }

  /* Matching */
  .match-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .match-col-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .match-item {
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 48px;
    display: flex;
    align-items: center;
  }

  .match-item:hover:not(.disabled) { border-color: var(--accent); }
  .match-item.selected { border-color: var(--accent); background: rgba(0,212,255,0.1); }
  .match-item.matched { border-color: var(--correct); background: rgba(16,185,129,0.08); }
  .match-item.wrong-match { border-color: var(--wrong); background: rgba(239,68,68,0.08); }

  .match-pair-indicator {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 10px;
    flex-shrink: 0;
  }

  /* Feedback panel */
  .feedback {
    border-radius: 12px;
    padding: 20px 24px;
    margin-top: 16px;
    display: none;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback.correct {
    background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.3);
  }

  .feedback.wrong {
    background: rgba(239,68,68,0.06);
    border: 1px solid rgba(239,68,68,0.25);
  }

  .feedback-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 8px;
  }

  .feedback.correct .feedback-title { color: var(--correct); }
  .feedback.wrong .feedback-title { color: var(--wrong); }

  .feedback-icon { font-size: 18px; }

  .feedback-answer {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 10px;
  }

  .feedback-answer strong {
    color: var(--correct);
    font-family: 'Space Mono', monospace;
  }

  .feedback-explain {
    font-size: 14px;
    color: #94a3b8;
    line-height: 1.7;
  }

  /* Actions row */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  /* Results screen */
  #results-screen { display: none; text-align: center; }

  .result-circle {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
    position: relative;
    background: radial-gradient(circle, rgba(0,212,255,0.08), transparent);
  }

  .result-pct {
    font-size: 42px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    font-family: 'Space Mono', monospace;
  }

  .result-label {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 500px;
    margin: 0 auto 40px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 800;
    font-family: 'Space Mono', monospace;
  }

  .stat-value.green { color: var(--correct); }
  .stat-value.red { color: var(--wrong); }
  .stat-value.blue { color: var(--accent); }

  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .result-message {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .result-sub {
    color: var(--muted);
    margin-bottom: 40px;
    font-weight: 400;
  }

  /* Review section */
  .review-section { text-align: left; margin-top: 48px; }

  .review-header {
    font-size: 14px;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .review-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 12px;
  }

  .review-item.r-correct { border-left: 3px solid var(--correct); }
  .review-item.r-wrong { border-left: 3px solid var(--wrong); }

  .review-q { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  .review-a { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }
  .review-a .yours { color: var(--wrong); }
  .review-a .right { color: var(--correct); }

  /* Ordering questions */
  .order-list { display: grid; gap: 8px; }

  .order-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: grab;
    user-select: none;
    font-size: 14px;
    transition: all 0.15s;
  }

  .order-item:hover { border-color: var(--accent); }
  .order-item.dragging { opacity: 0.4; }
  .order-item.drag-over { border-color: var(--accent); background: rgba(0,212,255,0.1); }
  .order-item.correct-pos { border-color: var(--correct); background: rgba(16,185,129,0.08); }
  .order-item.wrong-pos { border-color: var(--wrong); background: rgba(239,68,68,0.08); }

  .drag-handle { color: var(--muted); font-size: 14px; cursor: grab; }
  .order-num {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    flex-shrink: 0;
  }

  /* Category selector on home */
  .filter-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .filter-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.08);
  }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 16px 20px; }
    main { padding: 24px 16px 80px; }
    .tf-grid { grid-template-columns: 1fr; }
    .match-wrap { grid-template-columns: 1fr; }
    h1 { font-size: 32px; }
    .result-stats { grid-template-columns: 1fr; }
    .q-text { font-size: 17px; }
  }

  /* Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-card { animation: fadeIn 0.35s ease; }

  /* Tooltip */
  .hint-text {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
    font-style: italic;
  }
</style>
</head>
<body>

<header>
  <div class="logo">NW<span>Route</span> Quiz</div>
  <div class="score-badge">
    <span>✓ <span id="hdr-correct">0</span></span>
    <span>✗ <span id="hdr-wrong">0</span></span>
    <span>Q <span id="hdr-q">0</span>/<span id="hdr-total">0</span></span>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-fill" id="progress" style="width:0%"></div>
</div>

<main>

<!-- HOME SCREEN -->
<div id="home-screen">
  <div class="tag">Networking Fundamentals</div>
  <h1>Test Your <em>Network</em><br>Knowledge</h1>
  <p class="subtitle">Based on your NW Route study material — covering every key concept from LANs to static routing.</p>

  <div class="filter-row">
    <button class="filter-btn active" onclick="filterTopics('all',this)">All Topics</button>
    <button class="filter-btn" onclick="filterTopics('basics',this)">Basics</button>
    <button class="filter-btn" onclick="filterTopics('protocols',this)">Protocols</button>
    <button class="filter-btn" onclick="filterTopics('routing',this)">Routing</button>
    <button class="filter-btn" onclick="filterTopics('security',this)">Security</button>
  </div>

  <div class="topics-grid" id="topics-grid"></div>

  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    <button class="btn btn-secondary" onclick="selectAll()">Select All</button>
    <button class="btn btn-primary" onclick="startQuiz()">Start Quiz →</button>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quiz-screen">
  <div class="q-header">
    <div class="q-type-badge" id="q-type-badge">MCQ</div>
    <div class="q-counter">Question <span id="q-num">1</span> of <span id="q-total">0</span></div>
  </div>

  <div class="q-card" id="q-card">
    <div class="q-number" id="q-number">Q1</div>
    <div class="q-text" id="q-text"></div>
    <div id="q-body"></div>
  </div>

  <div class="feedback" id="feedback">
    <div class="feedback-title">
      <span class="feedback-icon" id="fb-icon"></span>
      <span id="fb-title"></span>
    </div>
    <div class="feedback-answer" id="fb-answer"></div>
    <div class="feedback-explain" id="fb-explain"></div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="skipQuestion()">Skip</button>
    <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()">Submit Answer</button>
    <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" style="display:none">Next Question →</button>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div id="results-screen">
  <div class="result-circle">
    <div class="result-pct" id="result-pct">0%</div>
    <div class="result-label">Score</div>
  </div>
  <div class="result-message" id="result-msg"></div>
  <p class="result-sub" id="result-sub"></p>

  <div class="result-stats">
    <div class="stat-card">
      <div class="stat-value green" id="res-correct">0</div>
      <div class="stat-label">Correct</div>
    </div>
    <div class="stat-card">
      <div class="stat-value red" id="res-wrong">0</div>
      <div class="stat-label">Wrong</div>
    </div>
    <div class="stat-card">
      <div class="stat-value blue" id="res-skip">0</div>
      <div class="stat-label">Skipped</div>
    </div>
  </div>

  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    <button class="btn btn-secondary" onclick="goHome()">← Home</button>
    <button class="btn btn-primary" onclick="restartQuiz()">Try Again</button>
  </div>

  <div class="review-section">
    <div class="review-header">Question Review</div>
    <div id="review-list"></div>
  </div>
</div>

</main>

  },

    options: [

      'Blocks FTP traffic from the 192.168.1.0 network'
    ],
    answer: 1,
    explain: 'Breaking it down: "permit tcp" = allow TCP, "192.168.1.0 0.0.0.255" = from any host in 192.168.1.0/24, "any" = to any destination, "eq 80" = destination port 80 (HTTP). This is a common extended ACL for web traffic.'

    ],

  },

    answer: false,

  },

  },

    ],
    answer: 1,

// ═══════════════════════════════════════════════════════
// TOPIC METADATA
// ═══════════════════════════════════════════════════════

const topicsMeta = [
  { id: 'basics', name: 'Network Basics', icon: '🌐', category: 'basics' },
  { id: 'protocols', name: 'Protocols & SLA', icon: '📡', category: 'protocols' },
  { id: 'routing', name: 'Routing', icon: '🔀', category: 'routing' },
  { id: 'security', name: 'ACLs & Security', icon: '🔒', category: 'security' },
];

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════

let selectedTopics = new Set(['basics','protocols','routing','security']);
let quizQuestions = [];
let currentIndex = 0;
let score = { correct: 0, wrong: 0, skipped: 0 };
let answers = [];
let answered = false;

// Match state
let matchLeft = null;
let matchRight = null;
let matchedPairs = [];
let matchPairColors = ['#00d4ff','#7c3aed','#10b981','#f59e0b','#ef4444'];

// Order state
let dragSrc = null;

// ═══════════════════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════════════════

function renderTopics() {
  const grid = document.getElementById('topics-grid');
  grid.innerHTML = topicsMeta.map(t => {
    const count = questions.filter(q => q.topic === t.id).length;
    const sel = selectedTopics.has(t.id) ? 'selected' : '';
    return `<div class="topic-card ${sel}" onclick="toggleTopic('${t.id}',this)">
      <div class="topic-icon">${t.icon}</div>
      <div class="topic-name">${t.name}</div>
      <div class="topic-count">${count} questions</div>
      <div class="topic-check">✓</div>
    </div>`;
  }).join('');
}

function toggleTopic(id, el) {
  if (selectedTopics.has(id)) selectedTopics.delete(id);
  else selectedTopics.add(id);
  el.classList.toggle('selected');
}

function filterTopics(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (cat === 'all') selectedTopics = new Set(['basics','protocols','routing','security']);
  else { selectedTopics.clear(); selectedTopics.add(cat); }
  renderTopics();
}

function selectAll() {
  selectedTopics = new Set(['basics','protocols','routing','security']);
  renderTopics();
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function startQuiz() {
  const pool = questions.filter(q => selectedTopics.has(q.topic));
  if (pool.length === 0) { alert('Please select at least one topic!'); return; }
  quizQuestions = shuffle(pool);
  currentIndex = 0;
  score = { correct: 0, wrong: 0, skipped: 0 };
  answers = new Array(quizQuestions.length).fill(null);

  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('q-total').textContent = quizQuestions.length;
  document.getElementById('hdr-total').textContent = quizQuestions.length;

  renderQuestion();
}

// ═══════════════════════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════════════════════

function renderQuestion() {
  const q = quizQuestions[currentIndex];
  answered = false;

  // Reset UI
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'inline-flex';
  document.getElementById('next-btn').style.display = 'none';

  // Header
  document.getElementById('q-num').textContent = currentIndex + 1;
  document.getElementById('q-number').textContent = `Q${currentIndex + 1}`;
  document.getElementById('q-text').textContent = q.q;

  // Type badge
  const badge = document.getElementById('q-type-badge');
  const typeMap = {
    mcq: ['MCQ', 'badge-mcq'],
    tf: ['True / False', 'badge-tf'],
    fitb: ['Fill in the Blank', 'badge-fitb'],
    match: ['Matching', 'badge-match'],
    order: ['Ordering', 'badge-order']
  };
  badge.className = 'q-type-badge ' + typeMap[q.type][1];
  badge.textContent = typeMap[q.type][0];

  // Progress
  const pct = ((currentIndex) / quizQuestions.length) * 100;
  document.getElementById('progress').style.width = pct + '%';

  // Render body
  const body = document.getElementById('q-body');
  if (q.type === 'mcq') body.innerHTML = renderMCQ(q);
  else if (q.type === 'tf') body.innerHTML = renderTF(q);
  else if (q.type === 'fitb') body.innerHTML = renderFITB(q);
  else if (q.type === 'match') { body.innerHTML = renderMatch(q); initMatch(q); }
  else if (q.type === 'order') { body.innerHTML = renderOrder(q); initOrder(); }

  // Scroll top
  window.scrollTo(0, 0);
}

function renderMCQ(q) {
  return `<div class="options-grid">` +
    q.options.map((opt, i) =>
      `<button class="option" onclick="selectMCQ(this,${i})">
        <span class="opt-label">${'ABCD'[i]}</span>
        <span>${opt}</span>
      </button>`
    ).join('') +
  `</div>`;
}

function selectMCQ(el, i) {
  if (answered) return;
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  el.dataset.idx = i;
}

function renderTF(q) {
  return `<div class="tf-grid">
    <button class="tf-btn" onclick="selectTF(this,'true')">✓ True</button>
    <button class="tf-btn" onclick="selectTF(this,'false')">✗ False</button>
  </div>`;
}

function selectTF(el, val) {
  if (answered) return;
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  el.dataset.val = val;
}

function renderFITB(q) {
  return `<div class="fitb-wrap">
    <input class="fitb-input" type="text" id="fitb-inp" placeholder="Type your answer here…" autocomplete="off" />
    <p class="hint-text">💡 Type the exact term or abbreviation</p>
  </div>`;
}

function renderMatch(q) {
  const rights = shuffle(q.pairs.map((p, i) => ({ text: p.right, idx: i })));
  return `<div class="match-wrap">
    <div>
      <div class="match-col-label">Column A</div>
      ${q.pairs.map((p, i) => `<div class="match-item" id="ml-${i}" onclick="matchClickLeft(${i})">${p.left}</div>`).join('')}
    </div>
    <div>
      <div class="match-col-label">Column B</div>
      ${rights.map((r, i) => `<div class="match-item" id="mr-${r.idx}" data-ridx="${r.idx}" onclick="matchClickRight(${r.idx})">${r.text}</div>`).join('')}
    </div>
  </div>
  <p class="hint-text">👆 Click an item from Column A, then click its match in Column B</p>`;
}

function initMatch(q) {
  matchLeft = null; matchRight = null; matchedPairs = [];
}

function matchClickLeft(idx) {
  if (answered) return;
  document.querySelectorAll('[id^="ml-"]').forEach(e => e.classList.remove('selected'));
  const el = document.getElementById('ml-' + idx);
  if (matchedPairs.find(p => p.left === idx)) return;
  matchLeft = idx;
  el.classList.add('selected');
  tryMatch();
}

function matchClickRight(idx) {
  if (answered) return;
  document.querySelectorAll('[id^="mr-"]').forEach(e => e.classList.remove('selected'));
  const el = document.getElementById('mr-' + idx);
  if (matchedPairs.find(p => p.right === idx)) return;
  matchRight = idx;
  el.classList.add('selected');
  tryMatch();
}

function tryMatch() {
  if (matchLeft === null || matchRight === null) return;
  const color = matchPairColors[matchedPairs.length % matchPairColors.length];
  const lEl = document.getElementById('ml-' + matchLeft);
  const rEl = document.getElementById('mr-' + matchRight);
  lEl.style.borderColor = color;
  rEl.style.borderColor = color;
  lEl.classList.remove('selected'); rEl.classList.remove('selected');
  matchedPairs.push({ left: matchLeft, right: matchRight });
  matchLeft = null; matchRight = null;
}

function renderOrder(q) {
  return `<div class="order-list" id="order-list">
    ${q.items.map((item, i) =>
      `<div class="order-item" draggable="true" data-pos="${i}">
        <span class="drag-handle">⠿</span>
        <span class="order-num">${i + 1}</span>
        <span>${item}</span>
      </div>`
    ).join('')}
  </div>
  <p class="hint-text">⬆⬇ Drag items to reorder them</p>`;
}

function initOrder() {
  const list = document.getElementById('order-list');
  let items = [...list.querySelectorAll('.order-item')];

  items.forEach(item => {
    item.addEventListener('dragstart', e => {
      dragSrc = item;
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drag-over'); });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      if (dragSrc && dragSrc !== item) {
        const allItems = [...list.querySelectorAll('.order-item')];
        const srcIdx = allItems.indexOf(dragSrc);
        const dstIdx = allItems.indexOf(item);
        if (srcIdx < dstIdx) item.after(dragSrc);
        else item.before(dragSrc);
        // update numbers
        [...list.querySelectorAll('.order-item')].forEach((el, i) => {
          el.querySelector('.order-num').textContent = i + 1;
        });
      }
    });
  });
}

// ═══════════════════════════════════════════════════════
// SUBMIT / EVALUATE
// ═══════════════════════════════════════════════════════

function submitAnswer() {
  if (answered) return;
  const q = quizQuestions[currentIndex];
  let userAnswer, isCorrect;

  if (q.type === 'mcq') {
    const sel = document.querySelector('.option.selected');
    if (!sel) { showHint('Please select an answer!'); return; }
    userAnswer = parseInt(sel.dataset.idx);
    isCorrect = userAnswer === q.answer;
    revealMCQ(q, userAnswer, isCorrect);

  } else if (q.type === 'tf') {
    const sel = document.querySelector('.tf-btn.selected');
    if (!sel) { showHint('Please select True or False!'); return; }
    userAnswer = sel.dataset.val === 'true';
    isCorrect = userAnswer === q.answer;
    revealTF(q, userAnswer, isCorrect);

  } else if (q.type === 'fitb') {
    const inp = document.getElementById('fitb-inp');
    userAnswer = inp.value.trim();
    if (!userAnswer) { showHint('Please type an answer!'); return; }
    const check = userAnswer.toLowerCase().replace(/\s+/g,'');
    const correct = q.answer.toLowerCase().replace(/\s+/g,'');
    const alts = (q.alternates || []).map(a => a.toLowerCase().replace(/\s+/g,''));
    isCorrect = check === correct || alts.includes(check);
    inp.classList.add(isCorrect ? 'correct' : 'wrong');

  } else if (q.type === 'match') {
    const q2 = quizQuestions[currentIndex];
    if (matchedPairs.length < q2.pairs.length) { showHint(`Match all ${q2.pairs.length} pairs!`); return; }
    let allCorrect = true;
    matchedPairs.forEach(pair => {
      const correct = pair.left === pair.right;
      if (!correct) allCorrect = false;
      document.getElementById('ml-' + pair.left).classList.add(correct ? 'matched' : 'wrong-match');
      document.getElementById('mr-' + pair.right).classList.add(correct ? 'matched' : 'wrong-match');
    });
    isCorrect = allCorrect;
    userAnswer = 'matched';

    // Show correct connections
    if (!isCorrect) {
      q2.pairs.forEach((p, i) => {
        const lEl = document.getElementById('ml-' + i);
        const rEl = document.getElementById('mr-' + i);
        lEl.style.borderColor = '#10b981';
        rEl.style.borderColor = '#10b981';
      });
    }

  } else if (q.type === 'order') {
    const list = document.getElementById('order-list');
    const items = [...list.querySelectorAll('.order-item')];
    const userOrder = items.map(el => parseInt(el.dataset.pos));
    isCorrect = JSON.stringify(userOrder) === JSON.stringify(q.answer);
    userAnswer = userOrder;
    items.forEach((el, i) => {
      const correct = userOrder[i] === q.answer[i];
      el.classList.add(correct ? 'correct-pos' : 'wrong-pos');
    });
    // disable dragging
    items.forEach(el => el.setAttribute('draggable', 'false'));
  }

  answered = true;
  if (isCorrect) score.correct++; else score.wrong++;
  answers[currentIndex] = { q, userAnswer, isCorrect };

  // Update header
  document.getElementById('hdr-correct').textContent = score.correct;
  document.getElementById('hdr-wrong').textContent = score.wrong;
  document.getElementById('hdr-q').textContent = currentIndex + 1;

  // Disable inputs
  document.querySelectorAll('.option, .tf-btn, #fitb-inp').forEach(el => {
    el.classList.add('disabled');
    el.style.pointerEvents = 'none';
  });

  // Show feedback
  showFeedback(q, isCorrect, q.type === 'fitb' ? userAnswer : null);

  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'inline-flex';
}

function revealMCQ(q, userAnswer, isCorrect) {
  document.querySelectorAll('.option').forEach((el, i) => {
    if (i === q.answer) el.classList.add('correct');
    else if (i === userAnswer && !isCorrect) el.classList.add('wrong');
  });
}

function revealTF(q, userAnswer, isCorrect) {
  document.querySelectorAll('.tf-btn').forEach(el => {
    const val = el.dataset.val === 'true';
    if (val === q.answer) el.classList.add('correct');
    else if (val === userAnswer && !isCorrect) el.classList.add('wrong');
  });
}

function showFeedback(q, isCorrect, typed) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  document.getElementById('fb-icon').textContent = isCorrect ? '✓' : '✗';
  document.getElementById('fb-title').textContent = isCorrect ? 'Correct!' : 'Not quite right';

  let answerText = '';
  if (q.type === 'mcq') answerText = `Correct answer: ${q.options[q.answer]}`;
  else if (q.type === 'tf') answerText = `Correct answer: ${q.answer ? 'True' : 'False'}`;
  else if (q.type === 'fitb') answerText = `Correct answer: ${q.answer}${typed && !isCorrect ? ` (You wrote: ${typed})` : ''}`;
  else if (q.type === 'match') answerText = isCorrect ? 'All pairs matched correctly!' : 'Check the green-highlighted correct pairs above.';
  else if (q.type === 'order') answerText = isCorrect ? 'Perfect order!' : 'Correct order shown above (green = correct position).';

  document.getElementById('fb-answer').innerHTML = `<strong>→</strong> ${answerText}`;
  document.getElementById('fb-explain').textContent = q.explain;
  fb.style.display = 'block';
}

function showHint(msg) {
  const btn = document.getElementById('submit-btn');
  btn.textContent = msg;
  btn.style.background = '#ef4444';
  setTimeout(() => { btn.textContent = 'Submit Answer'; btn.style.background = ''; }, 2000);
}

function skipQuestion() {
  if (answered) { nextQuestion(); return; }
  const q = quizQuestions[currentIndex];
  score.skipped++;
  answers[currentIndex] = { q, userAnswer: null, isCorrect: false, skipped: true };
  document.getElementById('hdr-q').textContent = currentIndex + 1;

  // Show correct answer on skip
  answered = true;
  showFeedback(q, false, null);
  document.getElementById('feedback').querySelector('#fb-title').textContent = 'Skipped — Here\'s the answer:';
  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'inline-flex';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

// ═══════════════════════════════════════════════════════
// RESULTS
// ═══════════════════════════════════════════════════════

function showResults() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';
  document.getElementById('progress').style.width = '100%';

  const total = quizQuestions.length;
  const pct = Math.round((score.correct / total) * 100);
  document.getElementById('result-pct').textContent = pct + '%';
  document.getElementById('res-correct').textContent = score.correct;
  document.getElementById('res-wrong').textContent = score.wrong;
  document.getElementById('res-skip').textContent = score.skipped;

  let msg, sub;
  if (pct >= 90) { msg = '🏆 Outstanding!'; sub = 'You have mastered networking fundamentals!'; }
  else if (pct >= 75) { msg = '🎯 Great Work!'; sub = 'Strong understanding — review a few weak spots.'; }
  else if (pct >= 60) { msg = '📚 Good Effort'; sub = 'Solid base — revisit routing and protocols.'; }
  else { msg = '💪 Keep Practicing!'; sub = 'Review the slides and try again — you\'ve got this!'; }

  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-sub').textContent = sub;

  // Review list
  const list = document.getElementById('review-list');
  list.innerHTML = answers.map((ans, i) => {
    if (!ans) return '';
    const icon = ans.skipped ? '⏭' : ans.isCorrect ? '✓' : '✗';
    const cls = ans.isCorrect ? 'r-correct' : 'r-wrong';
    let detail = '';
    if (!ans.isCorrect && !ans.skipped) {
      if (ans.q.type === 'mcq') detail = `<div class="review-a">You chose: <span class="yours">${ans.q.options[ans.userAnswer] || '—'}</span> · Correct: <span class="right">${ans.q.options[ans.q.answer]}</span></div>`;
      else if (ans.q.type === 'tf') detail = `<div class="review-a">You chose: <span class="yours">${ans.userAnswer !== null ? (ans.userAnswer ? 'True':'False') : '—'}</span> · Correct: <span class="right">${ans.q.answer ? 'True':'False'}</span></div>`;
      else if (ans.q.type === 'fitb') detail = `<div class="review-a">Correct answer: <span class="right">${ans.q.answer}</span></div>`;
    }
    return `<div class="review-item ${cls}">
      <div class="review-q">${icon} ${ans.q.q.substring(0, 120)}${ans.q.q.length > 120 ? '…' : ''}</div>
      ${detail}
    </div>`;
  }).join('');

  window.scrollTo(0, 0);
}

function goHome() {
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  document.getElementById('progress').style.width = '0%';
  document.getElementById('hdr-correct').textContent = '0';
  document.getElementById('hdr-wrong').textContent = '0';
  document.getElementById('hdr-q').textContent = '0';
}

function restartQuiz() {
  document.getElementById('results-screen').style.display = 'none';
  startQuiz();
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════

renderTopics();
</script>
